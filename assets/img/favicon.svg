<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f7ff" />
      <stop offset="50%" stop-color="#00ff9d" />
      <stop offset="100%" stop-color="#ff00c8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Fondo oscuro circular -->
  <circle cx="50" cy="50" r="46" fill="#0a0a18" stroke="url(#neonGrad)" stroke-width="4" filter="url(#glow)" />
  <!-- Anillo interno decorativo -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#00f7ff" stroke-width="1" stroke-dasharray="8 4" opacity="0.6" />
  <!-- Monograma JSVR -->
  <text x="50" y="58" font-family="'Orbitron', sans-serif, monospace" font-size="28" font-weight="800" text-anchor="middle" fill="url(#neonGrad)" filter="url(#glow)">JS<tspan fill="#ff00c8">VR</tspan></text>
</svg>
